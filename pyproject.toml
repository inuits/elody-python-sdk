# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "elody"
version     = "0.0.271"
description = "elody SDK for Python"
readme      = "README.md"
authors     = [{ name = "Inuits", email = "developers@inuits.eu" }]
license     = { file  = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
keywords = ["elody", "SDK"]
dependencies = [
  "certifi>=2026.10.19",
  "charset-normalizer>=3.5.0",
  "idna>=3.18",
  "requests>=2.34.2",
  "urllib3>=2.8.0",
]

[project.optional-dependencies]
loader = [
  "APScheduler>=3.11.2",
  "cloudevents>=2.0.0",
  "inuits-policy-based-auth>=10.1.1",
  "jsonschema>=4.26.0",
  "pytz>=2025.2",
  "six>=1.17.0",
  "tzlocal>=5.4.4",
]
util = ["cloudevents>=2.0.0"]
# traces, metrics, logs and errors to an OpenTelemetry collector (elody.observability)
observability = [
  "Flask>=3.1.3",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-flask>=0.66b0",
  "opentelemetry-instrumentation-requests>=0.66b0",
]

[project.urls]
Homepage = "https://github.com/inuits/elody-python-sdk"
